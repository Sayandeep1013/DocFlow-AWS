name: IaC lint and security

# tflint, tfsec (via Trivy) and checkov on every push and pull request.
# Findings are reported but do not fail the build yet (soft fail) while the
# baseline is being triaged; flip soft_fail / exit-code once it is clean.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: tflint (root, modules, examples)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=error || true

  tfsec:
    name: tfsec (Trivy config scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # examples/ re-evaluate the same modules many times over and blow the
          # scan deadline; the root module and modules/ cover every resource.
          skip-dirs: examples,docs,tests,scripts
          severity: HIGH,CRITICAL
          timeout: 30m
          exit-code: "0"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          soft_fail: true
